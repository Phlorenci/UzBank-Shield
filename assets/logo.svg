<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- Shield -->
  <path
    d="M 256 36 L 452 108 L 452 268 C 452 370 362 448 256 476 C 150 448 60 370 60 268 L 60 108 Z"
    fill="#0B1E3A"
  />

  <!-- Shield inner bevel -->
  <path
    d="M 256 62 L 428 126 L 428 268 C 428 356 348 426 256 450 C 164 426 84 356 84 268 L 84 126 Z"
    fill="#0F2448"
  />

  <!-- Pediment -->
  <polygon points="256,103 358,163 154,163" fill="#00C8E8" />

  <!-- Entablature -->
  <rect x="148" y="163" width="216" height="20" fill="#00C8E8" />

  <!-- Columns -->
  <rect x="163" y="183" width="44" height="104" fill="#00C8E8" />
  <rect x="234" y="183" width="44" height="104" fill="#00C8E8" />
  <rect x="305" y="183" width="44" height="104" fill="#00C8E8" />

  <!-- Stylobate step 1 -->
  <rect x="148" y="287" width="216" height="18" fill="#00C8E8" />

  <!-- Stylobate step 2 -->
  <rect x="130" y="305" width="252" height="18" fill="#00C8E8" />

  <!-- Divider -->
  <line x1="148" y1="349" x2="364" y2="349" stroke="#00C8E8" stroke-width="1.5" opacity="0.38" />

  <!-- UZBANK -->
  <text
    x="256" y="385"
    text-anchor="middle"
    font-family="'Cinzel', serif"
    font-weight="700"
    font-size="38"
    letter-spacing="6"
    fill="#00C8E8"
  >UZBANK</text>

  <!-- SHIELD -->
  <text
    x="256" y="412"
    text-anchor="middle"
    font-family="'Cinzel', serif"
    font-weight="400"
    font-size="20"
    letter-spacing="10"
    fill="#6DD8EE"
